apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devflow-release-service-bootstrap
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]
