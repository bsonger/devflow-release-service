apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: devflow-tekton-git-clone
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/component: tekton-task
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  results:
    - name: commit
      description: git commit SHA
      type: string
    - name: git-tag
      description: exact git tag on HEAD, empty when absent
      type: string
  workspaces:
    - name: output
    - name: ssh
  steps:
    - name: clone
      image: mcp/git:latest
      script: |
        mkdir -p ~/.ssh
        cp $(workspaces.ssh.path)/id_rsa ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git clone $(params.url) $(workspaces.output.path)
        cd $(workspaces.output.path)
        git checkout $(params.revision)
        git rev-parse HEAD | tee $(results.commit.path)
        if TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
          printf "%s" "$TAG" | tee $(results.git-tag.path)
        else
          : > $(results.git-tag.path)
        fi
