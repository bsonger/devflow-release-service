apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: devflow-tekton-image-build-and-push
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: devflow
    app.kubernetes.io/component: tekton-task
spec:
  params:
    - name: IMAGE_REPOSITORY
      type: string
    - name: IMAGE_TAG
      type: string
    - name: GIT_TAG
      type: string
      default: ""
    - name: DOCKERFILE
      type: string
      default: Dockerfile
  results:
    - name: IMAGE_DIGEST
      type: string
    - name: IMAGE_TAG
      type: string
  workspaces:
    - name: source
    - name: dockerconfig
      mountPath: /.docker/
    - name: ssh
  steps:
    - name: build-push
      image: quay.io/buildah/stable:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      env:
        - name: HTTP_PROXY
          value: http://192.168.1.2:7890
        - name: HTTPS_PROXY
          value: http://192.168.1.2:7890
        - name: NO_PROXY
          value: localhost,127.0.0.1,.svc,.cluster.local
        - name: REGISTRY_AUTH_FILE
          value: /.docker/.dockerconfigjson
      script: |
        set -e
        TAG="$(params.GIT_TAG)"
        if [ -z "${TAG}" ]; then
          TAG="$(params.IMAGE_TAG)"
        fi
        IMAGE="$(params.IMAGE_REPOSITORY):${TAG}"
        SRC="$(workspaces.source.path)"
        SSH_DIR="${SRC}/.tekton-ssh"

        cleanup() {
          rm -rf "${SSH_DIR}"
        }
        trap cleanup EXIT

        mkdir -p "${SSH_DIR}"
        cp "$(workspaces.ssh.path)/id_rsa" "${SSH_DIR}/id_rsa"
        chmod 600 "${SSH_DIR}/id_rsa"
        ssh-keyscan github.com > "${SSH_DIR}/known_hosts"

        if [ ! -f "${SRC}/$(params.DOCKERFILE)" ]; then
          echo "ERROR: missing dockerfile ${SRC}/$(params.DOCKERFILE)"
          echo "Available Dockerfile candidates:"
          find "${SRC}" -maxdepth 2 \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.dockerfile' \) | sort
          exit 1
        fi

        echo "🔧 Build image ${IMAGE}"
        buildah bud -f ${SRC}/$(params.DOCKERFILE) -t ${IMAGE} ${SRC}

        echo "🚀 Push image to registry"
        buildah push ${IMAGE} docker://${IMAGE}

        buildah push \
          --digestfile /tmp/digest \
          ${IMAGE} \
          docker://${IMAGE}

        DIGEST=$(cat /tmp/digest)
        echo "✅ Image digest: ${DIGEST}"
        echo -n "${DIGEST}" > $(results.IMAGE_DIGEST.path)
        echo -n "${TAG}" > $(results.IMAGE_TAG.path)
