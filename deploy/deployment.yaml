apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow-release-service
  namespace: devflow-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devflow-release-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devflow-release-service
    spec:
      serviceAccountName: devflow-release-service
      imagePullSecrets:
        - name: aliyun-docker-config
      containers:
        - name: devflow-release-service
          image: registry.cn-hangzhou.aliyuncs.com/devflow/devflow-release-service:staging
          env:
            - name: IMAGE_REGISTRY
              value: registry.cn-hangzhou.aliyuncs.com
            - name: IMAGE_REGISTRY_NAMESPACE
              value: devflow
            - name: IMAGE_REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aliyun-registry-credentials
                  key: username
                  optional: true
            - name: IMAGE_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aliyun-registry-credentials
                  key: password
                  optional: true
          ports:
            - containerPort: 8083
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/devflow/config/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: release-service-config
