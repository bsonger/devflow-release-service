info:
  contact: {}
paths:
  /api/v1/intents:
    get:
      description: 按 kind、status、resource 等维度查询 execution intents
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IntentListResponse'
      summary: 获取执行意图列表
      tags:
      - Intent
  /api/v1/intents/{id}:
    get:
      parameters:
      - description: Intent ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IntentResponse'
      summary: 获取执行意图
      tags:
      - Intent
  /api/v1/releases:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ReleaseListResponse'
      summary: 获取Release列表
      tags:
      - Release
    post:
      consumes:
      - application/json
      description: 创建一个新的Release
      parameters:
      - description: Release Data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/api.CreateReleaseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.ReleaseResponse'
      summary: 创建Release
      tags:
      - Release
  /api/v1/releases/{id}:
    get:
      parameters:
      - description: Release ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ReleaseResponse'
      summary: 获取Release
      tags:
      - Release
swagger: "2.0"
